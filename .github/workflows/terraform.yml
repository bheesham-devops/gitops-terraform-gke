name: 🏗️ Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TF_VERSION: "1.9.0"
  WORKING_DIR: "."
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Validate & Plan
  # Runs on every push and pull_request.
  # Checks formatting, validates config and produces a plan.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: 🔍 Validate & Plan
    runs-on: ubuntu-latest
    environment: plan

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 🔖 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.10
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: ⚙️ Configure kubectl for GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --region ${{ secrets.GKE_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: 🏗️ Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🗂️ Terraform Init
        run: terraform init -input=false

      - name: 🎨 Terraform Format Check
        run: terraform fmt -check -recursive
        # Fails the pipeline if any .tf file is not correctly formatted.
        # Developers must run `terraform fmt` locally before pushing.

      - name: ✅ Terraform Validate
        run: terraform validate

      - name: 📋 Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}"

      - name: 📤 Upload Plan Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tfplan
          path: tfplan
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 — Apply
  # Runs only on pushes to main, and only AFTER manual approval via the
  # "apply" GitHub Environment protection rule.
  # Downloads the exact plan produced in Job 1 — no surprises.
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: 🚀 Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: apply          # ← requires a manual approval gate in GitHub
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 🔖 Checkout
        uses: actions/checkout@v4.2.2

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.10
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: ⚙️ Configure kubectl for GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --region ${{ secrets.GKE_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: 🏗️ Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🗂️ Terraform Init
        run: terraform init -input=false

      - name: 📥 Download Plan Artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: tfplan

      - name: 🚀 Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
